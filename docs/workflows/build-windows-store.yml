name: Build Microsoft Store package
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/student-desktop/**'
      - 'packages/protocol/**'
      - 'tests/**'
      - '.github/workflows/build-windows-store.yml'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  store:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:store --workspace @koshirme/student-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: koshirme-store-x64
          path: |
            apps/student-desktop/release/store/*-x64-store.appx
            apps/student-desktop/release/store/*-x64-store.appx.sha256
          if-no-files-found: error

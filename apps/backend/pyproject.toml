[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "koshirme-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy[asyncio]>=2.0.38,<2.1",
  "asyncpg>=0.30,<1", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1", "Pillow>=11.1,<13"
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "aiosqlite>=0.21,<1", "ruff>=0.9,<1", "websockets>=17.1,<18"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "Depends", "File"]
[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>KOSH!RME</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <strong>KOSH!RME</strong
        ><select id="language" aria-label="Язык">
          <option value="ru">Русский</option>
          <option value="kz">Қазақша</option>
          <option value="en">English</option>
        </select>
      </header>
      <section class="panel">
        <small id="mode"></small>
        <h1 id="title"></h1>
        <p id="description"></p>
        <h2 id="exam-title"></h2>
        <p id="student"></p>
        <div class="checks">
          <p id="backend"></p>
          <p id="extension"></p>
          <p id="screen"></p>
        </div>
        <p id="notice"></p>
        <button id="permission-button" class="secondary" hidden></button>
      </section>
      <p id="error" class="error" role="alert"></p>
      <small class="signature">by Mr. Kadyr · Desktop 0.1.7</small>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
